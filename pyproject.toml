[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "idms-persistence"
license = { text = "EUPL-1.2" }
dynamic = ["version"]
requires-python = ">=3.10"
description = "REST interface for the configuration of projects, processes and process-groups"
dependencies = [
    "apscheduler",
    "flask",
    "gitpython",
    "paramiko",
    "psycopg2-binary",
    "pycryptodome",
    "pylint",
    "python-dateutil",
    "pyyaml",
    "requests",
    "ldap3",
    "marshmallow<4",
    "marshmallow-sqlalchemy",
    "flask-caching",
    "flask-login",
    "flask-migrate<4.1.0",
    "flask-script",
    "flask-httpauth",
    "flask-marshmallow",
    "flask-sqlalchemy",
    "redis",
    "rq",
    "sqlalchemy<2.0.0",
    "werkzeug==3.1.9",
    "idms-common-constants>=0.0.7",
    "python-irodsclient"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["idms.persistence"]

[tool.uv.sources]
# only works for gitlab ci/cd during uv sync
idms-common-constants = { index = "internal-gitlab" }

[[tool.uv.index]]
name = "internal-gitlab"
url = "https://gitlab.rivm.nl/api/v4/projects/4682/packages/pypi/simple"

[tool.setuptools_scm]
fallback_version = "0.0.0"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
search_parent_directories = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest]
strict_config = true
strict_markers = false
strict_parametrization_ids = false
strict_xfail = true

addopts = [
    "--cov=src",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--junitxml=report.xml",
    "--doctest-modules"
]

pythonpath = [
    "src"
]

testpaths = [
    "test",
]

norecursedirs = [
    ".git",
    ".venv",
]

markers = [
    "unit: Tests individual functions or small units of code in isolation",
    "integration: Tests how multiple components or services work together",
    "e2e: Simulates real-world end-to-end user scenarios",
    "regression: Ensures that previously fixed bugs stay fixed",
    "smoke: Quick checks to verify core system functionality",
]

# pytest-cov configuration
[tool.coverage.report]
exclude_lines = [
    "if __name__ == '__main__'",
]

omit = [
    "test/*"
]

[tool.coverage.xml]
output = "coverage.xml"
